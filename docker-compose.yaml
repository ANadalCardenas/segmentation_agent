
services:
  segmentation_agent:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: segmentation_agent
    image: segmentation_agent:latest
    shm_size: '8gb'
    # If you prefer using a prebuilt image, replace build: . with image: your/image
    volumes:
      - /home/${USER}/workspace/segmentation_agent/scripts:/workspace/segmentation_agent/scripts
      - /home/${USER}/workspace/segmentation_agent/media:/workspace/segmentation_agent/media
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.Xauthority
    gpus: all
    working_dir: /workspace/segmentation_agent
    stdin_open: true
    tty: true
   
